services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  thingsboard:
    image: thingsboard/tb-ce:latest
    environment:
      TB_PG_DB_URL: jdbc:postgresql://postgres:5432/thingsboard
      TB_PG_DB_USER: postgres
      TB_PG_DB_PASSWORD: postgres
    ports:
      - "8080:8080"
      - "1883:1883"
    depends_on:
      - postgres

volumes:
  pgdata:
