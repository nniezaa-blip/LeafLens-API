[project]
name = "lextari-api"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pyjwt[crypto]>=2.10.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.0.0",
    "httpx>=0.28.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "uvicorn[standard]>=0.34.0",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.ruff]
line-length = 99
target-version = "py313"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit (security)
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "PGH",  # pygrep-hooks
    "FBT",  # flake8-boolean-trap
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLF",  # flake8-self (private member access)
    "T20",  # flake8-print (no print() in production)
    "PL",   # pylint
    "PERF", # perflint
    "FURB", # refurb
]
ignore = [
    "E501",    # line too long — handled by formatter
    "PLR0913", # too many arguments — FastAPI Depends makes this noisy
    "PLR0917", # too many positional arguments — client method signatures
    "PLR2004", # magic values — fine in tests and threshold constants
    "S101",    # assert in tests is fine
    "B008",    # FastAPI Depends() in function signatures — standard pattern
    "PLW0603", # global for singletons — standard pattern
    "PLC0415", # conditional imports (Workers/httpx fallbacks) — intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = [
    "jwt.*",
    "pyodide.*",
    "workers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers -x"

[tool.uv]
package = false

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
tag_format = "v$version"
update_changelog_on_bump = true
